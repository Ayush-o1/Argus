name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Integration tests run against a real Neo4j rather than a mocked driver.
    # A mock cannot tell you that collect(...)[0..5] truncates a count, that
    # count(*)+1 races under concurrency, or that a lookup is a label scan —
    # which is precisely how those defects survived a green suite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus_admin
          POSTGRES_PASSWORD: argus_test_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U argus_admin -d argus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/argus_test_password
          NEO4J_server_memory_heap_max__size: 1G
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Install generator dependencies
        # The generator is a separate project with its own virtualenv, so its
        # modules are importable only when its requirements are present. Without
        # this the generator tests skip — and the guard below correctly treats a
        # skipped test in CI as a failure, because a green run that exercised
        # nothing is worse than a red one.
        run: pip install -r ../generator/requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Apply migrations to the test databases
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: argus_test_password
          POSTGRES_SUPERUSER_PASSWORD: argus_test_password
        run: |
          # Both stores. The Postgres migrations create the least-privilege
          # application role as well as the tables, so without them the identity,
          # audit and provenance integration tests cannot even connect — they
          # would skip, and the guard below would fail the run.
          python -c "
          import asyncio
          from app.database.neo4j import connect_neo4j, close_neo4j
          from app.database.migrations import run_migrations, current_version
          from app.database.pg_migrations import run_pg_migrations

          async def main():
              applied = await run_pg_migrations()
              print('postgres migrations applied:', applied)

              driver = await connect_neo4j()
              await run_migrations(driver)
              print('neo4j schema version:', await current_version(driver))
              await close_neo4j()

          asyncio.run(main())
          "

      - name: Pytest
        env:
          # Deliberately *not* NEO4J_URI/NEO4J_PASSWORD. Tests must reach the
          # graph through the conftest fixture, which honours TEST_NEO4J_*; a
          # test that reaches for the application's own driver is a test that
          # depends on deployment configuration, and will pass on a developer
          # machine where both happen to be set while failing here.
          TEST_NEO4J_URI: bolt://localhost:7687
          TEST_NEO4J_PASSWORD: argus_test_password
          POSTGRES_SUPERUSER_PASSWORD: argus_test_password
        run: |
          set -o pipefail
          # Failures are echoed as workflow annotations as well as to the log.
          # Log download needs repository admin rights; annotations do not, so
          # without this a contributor who cannot read the logs is told only
          # "Process completed with exit code 1".
          pytest -v --tb=short 2>&1 | tee /tmp/pytest.log || {
            grep -E "^(FAILED|ERROR) " /tmp/pytest.log | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Fail if integration tests were skipped
        # Skipping on a missing database is correct locally and wrong in CI:
        # a green run that silently exercised nothing is worse than a red one.
        env:
          TEST_NEO4J_URI: bolt://localhost:7687
          TEST_NEO4J_PASSWORD: argus_test_password
          POSTGRES_SUPERUSER_PASSWORD: argus_test_password
        run: |
          output=$(pytest -q -m "" --no-header 2>&1)
          echo "$output"
          if echo "$output" | grep -qE "[0-9]+ skipped"; then
            echo "::error::Integration tests were skipped in CI — the Neo4j service is not reachable."
            exit 1
          fi

  backend-security:
    name: Backend security (pip-audit, bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e "."
          pip install pip-audit bandit

      - name: pip-audit (known vulnerable dependencies)
        run: pip-audit --desc --skip-editable

      - name: Bandit (static security analysis)
        # B101 (assert) is excluded: asserts here document invariants that
        # Cypher aggregates guarantee, and are not used for input validation.
        run: bandit -r app -ll --skip B101

  frontend:
    name: Frontend (eslint, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Next.js build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  frontend-security:
    name: Frontend security (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: npm audit
        # Gates at high. The tree is currently clean; this exists so it stays
        # that way rather than accumulating silently between releases.
        run: npm audit --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed once and removed later is still
          # exposed, so scanning only the tip would miss it.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
