[project]
name = "argus-backend"
version = "0.1.0"
description = "ARGUS FastAPI backend — graph API, analytics, local intelligence, and case management services."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.24",
    "redis>=5.1",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
]
# asyncpg backs identity, authorization and the audit log (see
# app/database/postgres.py for why a second datastore exists). argon2-cffi is
# the password hash — Argon2id is the current OWASP recommendation and is
# memory-hard, unlike PBKDF2. pyotp implements TOTP for MFA. All three are
# local; none makes a network call.
#
# scikit-learn is used for Isolation Forest anomaly detection (Phase 8) —
# unsupervised, trained fresh on ARGUS's own synthetic data every run, no
# external model or dataset. httpx is used only by the optional Ollama
# adapter (app/services/ollama.py); every other feature has no AI
# dependency at all, and both remain fully local. See ARGUS_PLAN.md Phase 10.

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends(...) in argument defaults is the standard FastAPI DI idiom
    "UP046", # Generic[T] base class kept for compatibility over PEP 695 syntax
]

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

# asyncpg ships no py.typed marker. The Connection/Record types we use are
# exercised by the integration tests against a real database, which is stronger
# evidence than a stub would be.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
