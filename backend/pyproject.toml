[project]
name = "argus-backend"
version = "0.1.0"
description = "ARGUS FastAPI backend — graph API, analytics, local intelligence, and case management services."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.24",
    "redis>=5.1",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "numpy>=1.26",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "reportlab>=4.2",
]
# asyncpg backs identity, authorization and the audit log (see
# app/database/postgres.py for why a second datastore exists). argon2-cffi is
# the password hash — Argon2id is the current OWASP recommendation and is
# memory-hard, unlike PBKDF2. pyotp implements TOTP for MFA. All three are
# local; none makes a network call.
#
# scikit-learn is used for Isolation Forest anomaly detection and for DBSCAN
# spatial clustering — unsupervised, trained fresh on ARGUS's own data every
# run, no external model or dataset. scipy and numpy arrive with it anyway, but
# are declared because Phase 8 imports them directly: the exact binomial test
# behind every rate comparison, and the array arithmetic behind the spatial
# statistics. Depending on a transitive dependency without saying so is how a
# working build breaks when the intermediate package drops it. httpx is used only by the optional Ollama
# adapter (app/services/ollama.py); every other feature has no AI
# dependency at all, and both remain fully local. See ARGUS_PLAN.md Phase 10.
#
# reportlab renders the PDF export format (Phase 8's "Report generator") by
# drawing the investigation's fields directly — no HTML/CSS layout engine, no
# system package (no Cairo, no Pango), just pure-Python plus its own bundled
# font metrics. It ships manylinux/macOS wheels, so `pip install` is enough on
# both a developer machine and CI; weasyprint was ruled out for exactly the
# system-dependency problem this project avoids everywhere else.

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends(...) in argument defaults is the standard FastAPI DI idiom
    "UP046", # Generic[T] base class kept for compatibility over PEP 695 syntax
]

# Neither ships a py.typed marker. The statistics they back are covered by unit
# tests with hand-computed expected values, which is stronger evidence than a
# stub would be.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

# asyncpg ships no py.typed marker. The Connection/Record types we use are
# exercised by the integration tests against a real database, which is stronger
# evidence than a stub would be.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
