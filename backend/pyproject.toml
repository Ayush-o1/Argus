[project]
name = "argus-backend"
version = "0.1.0"
description = "ARGUS FastAPI backend — graph API, analytics, local intelligence, and case management services."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.24",
    "redis>=5.1",
    "pydantic-settings>=2.6",
]
# scikit-learn (Isolation Forest anomaly detection) and httpx (optional
# Ollama adapter) are added in Phase 8 when they're actually used — see
# ARGUS_PLAN.md Phase 10 for the local-first intelligence design. Every
# other feature in the app has no AI dependency at all.

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends(...) in argument defaults is the standard FastAPI DI idiom
    "UP046", # Generic[T] base class kept for compatibility over PEP 695 syntax
]
