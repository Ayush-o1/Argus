services:
  neo4j:
    image: neo4j:5-community
    container_name: argus-neo4j
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-argus_dev_password}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: argus-redis
    ports:
      # Same reasoning as Postgres above: a developer machine may already run
      # its own Redis on 6379, so the host port is configurable.
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Identity, authorization and the audit log live here rather than in Neo4j.
  #
  # This is the one new datastore the audit recommended, and it is introduced
  # for a property Neo4j cannot provide: the audit log must survive compromise
  # of the application. Neo4j has no per-table privilege model in Community
  # edition, so any process holding write credentials — which the app must —
  # can SET or DELETE an audit node. In Postgres the application role is granted
  # INSERT only, and a trigger rejects UPDATE and DELETE outright, so tampering
  # requires database-superuser access rather than merely compromising ARGUS.
  #
  # The graph remains authoritative for entities and relationships. Nothing
  # about the intelligence model moves here.
  postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    ports:
      # 55432 on the host, not 5432: a developer machine may already run its own
      # PostgreSQL, and silently competing for the default port produces
      # authentication errors that look like credential bugs. ARGUS never binds
      # a port another Postgres is likely to hold.
      - "${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-argus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-argus_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-argus_admin} -d ${POSTGRES_DB:-argus}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Build context must be the repo root, not ./backend: the Dockerfile
      # bundles generator/ (see backend/Dockerfile's generator-builder stage)
      # so app/services/scenario.py's subprocess call to generator/.venv has
      # something to run inside the container, and that directory lives
      # outside a ./backend-scoped build context.
      context: .
      dockerfile: backend/Dockerfile
    container_name: argus-backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-argus_dev_password}
      REDIS_URL: redis://redis:6379/0
      # Optional — see ARGUS_PLAN.md Phase 10. Defaults to the host's local
      # Ollama if running; ARGUS works fully offline without it.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      # Identity, audit and provenance. Without these the container defaulted to
      # localhost:55432 — which inside the container is the container itself,
      # not the postgres service — so startup aborted on the first migration.
      # The port here is 5432, the service's own port on the compose network,
      # not the 55432 the host mapping uses.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-argus_admin}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-argus_dev_password}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-argus_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-argus_dev_app_password}

      CORS_ORIGINS: http://localhost:3000
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  postgres_data:
